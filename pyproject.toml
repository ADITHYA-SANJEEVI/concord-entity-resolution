[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "concord-entity-resolution"
version = "0.1.0"
description = "Large-scale entity resolution with bounded retrieval and reproducible evidence"
requires-python = ">=3.12"
authors = [
  { name = "Adithya Sanjeevi" },
]
dependencies = [
  "numpy==2.4.4",
  "pyarrow==25.0.1",
  "scipy==1.17.1",
  "scikit-learn==1.8.0",
  "sparse-dot-topn==1.2.0",
  "psutil>=7.0,<8",
  "jsonschema>=4.23,<5",
  "matplotlib>=3.10,<4",
  "lightgbm==4.7.0",
  "RapidFuzz==3.14.5",
  "Unidecode==1.4.0",
]

[project.scripts]
concord = "concord.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8", "pandas==3.0.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/concord"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/test_reference_contract.py" = ["I001"]
