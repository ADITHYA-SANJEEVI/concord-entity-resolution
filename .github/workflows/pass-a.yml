name: Concord Pass A public verification
on: [push, pull_request, workflow_dispatch]
jobs:
  public-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m ruff check src/concord --exclude legacy_amazon tests scripts
      - run: python -m compileall -q src/concord
      - run: git diff --check
      - run: python scripts/reproduce_pass_a.py --output outputs/ci-pass-a
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pass-a-${{ matrix.os }}
          path: outputs/ci-pass-a
